name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show repo layout
        run: |
          ls -la
          test -f package.json || (echo "package.json is not at the repo root" && exit 1)
          test -f www/index.html || (echo "www/index.html is missing" && exit 1)
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: 17}
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: handwriting-plotter-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
